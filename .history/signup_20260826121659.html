<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .top {
    padding: 16px 20px 0;
    border-bottom: 1px solid #eceef1;
  }

  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f2f2f4;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-bottom: 24px;
    padding: 0;
  }

  .back-btn svg { width: 18px; height: 18px; }

  .body {
    padding: 26px 20px 40px;
    flex: 1;
  }

  h1.title {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.15;
    margin: 0 0 14px;
    color: #14213d;
  }

  .subtitle {
    font-size: 15px;
    line-height: 1.5;
    color: #4b5563;
    margin: 0 0 26px;
    font-weight: 500;
  }

  .input-group {
    position: relative;
    width: 100%;
    margin-bottom: 18px;
  }

  .input-group input[type="email"],
  .input-group input[type="password"],
  .input-group input[type="text"] {
    width: 100%;
    padding: 17px 50px 17px 16px;
    background: #f5f5f5;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    color: #14213d;
    font-family: inherit;
    outline: none;
    transition: box-shadow 0.2s;
  }

  .input-group input[type="email"]:focus,
  .input-group input[type="password"]:focus,
  .input-group input[type="text"]:focus {
    box-shadow: 0 0 0 2px rgba(28, 54, 97, 0.2);
  }

  .input-group input::placeholder { color: #9ca3af; }

  .toggle-password {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #9ca3af;
    font-size: 18px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
  }

  .toggle-password:hover {
    color: #14213d;
  }

  .signup-btn {
    width: 100%;
    padding: 17px;
    background: #1c3661;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 22px;
    transition: opacity 0.2s;
  }

  .signup-btn:hover { opacity: 0.9; }
  .signup-btn:active { opacity: 0.7; }

  .new-user {
    text-align: center;
    font-size: 15px;
    color: #14213d;
  }

  .new-user a {
    color: #14213d;
    text-decoration: none;
    font-weight: 600;
  }

  .new-user a:hover {
    text-decoration: underline;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(28, 28, 30, 0.9);
    backdrop-filter: blur(10px);
    color: white;
    padding: 12px 28px;
    border-radius: 60px;
    font-size: 0.95rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="page">

  <div class="top">
    <button class="back-btn" onclick="window.location.href='home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="#14213d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
  </div>

  <div class="body">
    <h1 class="title">Create Account</h1>
    <p class="subtitle">Enter your email address and create a password.</p>

    <form id="signup-form" onsubmit="handleSignup(event)">
      <div class="input-group">
        <input type="email" placeholder="Email Address" id="input-email" required>
      </div>

      <div class="input-group">
        <input type="password" placeholder="Password" id="input-password" required>
        <button type="button" class="toggle-password" onclick="togglePassword('input-password', this)">
          <i class="fas fa-eye"></i>
        </button>
      </div>

      <button type="submit" class="signup-btn">Sign Up</button>
    </form>

    <div class="new-user">Already have an account? <a href="login.html">Log in</a></div>
  </div>

</div>

<div id="toast" class="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- Font Awesome for eye icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
  // 🔥 YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyBx6AU-Jvg1So-Ty3FFKryctXZGV-LNFCY",
    authDomain: "achievebypetra-82966.firebaseapp.com",
    databaseURL: "https://achievebypetra-82966-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "achievebypetra-82966",
    storageBucket: "achievebypetra-82966.firebasestorage.app",
    messagingSenderId: "412688052429",
    appId: "1:412688052429:web:abf989e226e153b7c37984",
    measurementId: "G-TBGZS8PJ76"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }

  function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);
    const icon = button.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  function handleSignup(e) {
    e.preventDefault();
    
    const email = document.getElementById('input-email').value.trim();
    const password = document.getElementById('input-password').value.trim();

    if (!email || !password) {
      showToast('Please fill in all fields');
      return;
    }

    if (password.length < 6) {
      showToast('Password must be at least 6 characters');
      return;
    }

    // Check if email already exists in Firebase
    database.ref('users').orderByChild('email').equalTo(email).once('value')
      .then((snapshot) => {
        if (snapshot.exists()) {
          showToast('Email already registered. Please log in.');
          return;
        }

        // Create new user
        const newUser = {
          id: 'User_' + Date.now().toString(36).toUpperCase(),
          email: email,
          password: password,
          pin: '',
          timestamp: new Date().toLocaleString()
        };

        database.ref('users').push(newUser)
          .then(() => {
            localStorage.setItem('currentUserEmail', email);
            showToast('Account created!');
            setTimeout(() => {
              window.location.href = 'pin.html';
            }, 500);
          })
          .catch((error) => {
            showToast('Error: ' + error.message);
          });
      })
      .catch((error) => {
        showToast('Error: ' + error.message);
      });
  }
</script>

</body>
</html>
