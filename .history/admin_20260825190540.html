<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PIN Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f3f9 0%, #e2e8f2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .admin-container {
            max-width: 750px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 25px 50px -8px rgba(0, 20, 40, 0.2);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 12px;
        }

        .admin-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-header h1 i {
            color: #1d3853;
            background: rgba(255,255,255,0.5);
            padding: 8px 12px;
            border-radius: 40px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-actions a,
        .header-actions button {
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(0,0,0,0.06);
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1d3853;
            cursor: pointer;
            transition: 0.15s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions a:hover,
        .header-actions button:hover {
            background: rgba(200, 215, 235, 0.7);
        }

        .header-actions a:active,
        .header-actions button:active {
            transform: scale(0.96);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255,255,255,0.5);
            padding: 0.8rem 1.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-box i {
            font-size: 1.2rem;
            color: #1d3853;
        }

        .stat-box span {
            font-weight: 600;
            color: #0b1e33;
        }

        .stat-box .count {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0b1e33;
        }

        .user-list {
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.5);
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .user-list-header {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            padding: 0.8rem 1.5rem;
            background: rgba(0,0,0,0.02);
            border-bottom: 1px solid rgba(0,0,0,0.04);
            font-weight: 600;
            font-size: 0.8rem;
            color: #3a5270;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .user-item {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            align-items: center;
            transition: 0.1s;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-item:hover {
            background: rgba(255,255,255,0.3);
        }

        .user-id {
            font-weight: 500;
            color: #0b1e33;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-id i {
            color: #2b5f7a;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .user-pin {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-weight: 600;
            font-size: 1rem;
            color: #0f2a3f;
            letter-spacing: 1.5px;
            background: rgba(255,255,255,0.3);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            display: inline-block;
            width: fit-content;
        }

        .user-pin.empty-pin {
            color: #8a9bb0;
            font-style: italic;
            font-weight: 400;
            letter-spacing: 0;
        }

        .user-actions {
            display: flex;
            gap: 6px;
        }

        .user-actions button {
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1d3853;
            cursor: pointer;
            transition: 0.1s;
            background: rgba(255,255,255,0.3);
            border: 1px solid rgba(0,0,0,0.04);
        }

        .user-actions button:hover {
            background: rgba(200, 215, 235, 0.5);
        }

        .user-actions button.danger {
            color: #b13e3e;
        }

        .user-actions button.danger:hover {
            background: rgba(200, 60, 60, 0.1);
        }

        .empty-state {
            padding: 2.5rem;
            text-align: center;
            color: #5a7a94;
            font-size: 0.95rem;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            opacity: 0.4;
            display: block;
        }

        .admin-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .admin-actions button {
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(0,0,0,0.04);
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1d3853;
            cursor: pointer;
            transition: 0.1s;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-actions button:active {
            transform: scale(0.96);
            background: rgba(200, 215, 235, 0.6);
        }

        .admin-actions button.primary {
            background: #1d3853;
            color: white;
        }

        .admin-actions button.primary:hover {
            background: #122b40;
        }

        .admin-actions button.danger {
            color: #b13e3e;
        }

        .admin-actions button.danger:hover {
            background: rgba(200, 60, 60, 0.1);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0b1e33;
            color: white;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.success {
            background: #1a6b3c;
        }

        @media (max-width: 600px) {
            .admin-container { padding: 1.5rem; }
            .user-list-header, .user-item {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 0.8rem 1rem;
            }
            .user-list-header { display: none; }
            .user-actions { margin-top: 4px; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-users-cog"></i> Admin Dashboard</h1>
            <div class="header-actions">
                <a href="pin.html"><i class="fas fa-arrow-left"></i> Back to PIN</a>
                <button id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <div class="stats" id="statsContainer">
            <div class="stat-box">
                <i class="fas fa-users"></i>
                <span>Total Users: <span class="count" id="totalUsers">0</span></span>
            </div>
            <div class="stat-box">
                <i class="fas fa-check-circle"></i>
                <span>With PIN Set: <span class="count" id="usersWithPin">0</span></span>
            </div>
        </div>

        <div class="user-list" id="userListContainer">
            <div class="user-list-header">
                <span>User ID</span>
                <span>PIN</span>
                <span>Actions</span>
            </div>
            <div id="userListBody">
                <div class="empty-state">
                    <i class="fas fa-user-plus"></i>
                    <div>No users created yet</div>
                    <div style="font-size: 0.85rem; margin-top: 4px; opacity: 0.7;">Go to PIN page to create a user</div>
                </div>
            </div>
        </div>

        <div class="admin-actions">
            <button class="primary" id="addUserBtn"><i class="fas fa-user-plus"></i> Add New User</button>
            <button id="clearAllBtn" class="danger"><i class="fas fa-trash-alt"></i> Clear All Users</button>
        </div>
        <div style="margin-top: 1rem; font-size: 0.75rem; color: #5a7a94; opacity: 0.7;">
            <i class="fas fa-info-circle"></i> Data is stored in your browser's localStorage.
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        (function() {
            "use strict";

            const STORAGE_KEY = 'pinAppUsers';

            function getUsers() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed)) return parsed;
                    }
                } catch (e) {}
                return [];
            }

            function saveUsers(users) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
            }

            // DOM
            const userListBody = document.getElementById('userListBody');
            const totalUsersEl = document.getElementById('totalUsers');
            const usersWithPinEl = document.getElementById('usersWithPin');
            const addUserBtn = document.getElementById('addUserBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const toastEl = document.getElementById('toast');

            function showToast(msg, type = 'info', duration = 2500) {
                toastEl.textContent = msg;
                toastEl.className = 'toast';
                if (type === 'success') toastEl.classList.add('success');
                toastEl.classList.add('show');
                clearTimeout(toastEl._timeout);
                toastEl._timeout = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, duration);
            }

            function renderUsers() {
                const users = getUsers();

                // Update stats
                totalUsersEl.textContent = users.length;
                usersWithPinEl.textContent = users.filter(u => u.pin && u.pin.length === 4).length;

                if (users.length === 0) {
                    userListBody.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-user-plus"></i>
                            <div>No users created yet</div>
                            <div style="font-size: 0.85rem; margin-top: 4px; opacity: 0.7;">Go to PIN page to create a user</div>
                        </div>
                    `;
                    return;
                }

                let html = '';
                users.forEach((u, index) => {
                    const hasPin = u.pin && u.pin.length === 4;
                    html += `
                        <div class="user-item" data-index="${index}">
                            <span class="user-id">
                                <i class="fas fa-circle" style="color: ${hasPin ? '#1a6b3c' : '#9aaec4'}; font-size: 0.5rem;"></i>
                                ${u.id}
                            </span>
                            <span class="user-pin ${hasPin ? '' : 'empty-pin'}">
                                ${hasPin ? u.pin : '— no PIN set —'}
                            </span>
                            <div class="user-actions">
                                ${hasPin ? `<button data-action="reset" data-id="${u.id}"><i class="fas fa-undo-alt"></i> reset</button>` : ''}
                                <button class="danger" data-action="delete" data-id="${u.id}"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                });
                userListBody.innerHTML = html;

                // Attach event listeners to action buttons
                document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const id = this.dataset.id;
                        if (confirm(`Delete user ${id}?`)) {
                            let users = getUsers();
                            users = users.filter(u => u.id !== id);
                            saveUsers(users);
                            renderUsers();
                            showToast(`🗑️ Deleted user ${id}`, 'success');
                        }
                    });
                });

                document.querySelectorAll('[data-action="reset"]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const id = this.dataset.id;
                        if (confirm(`Reset PIN for user ${id}?`)) {
                            let users = getUsers();
                            const user = users.find(u => u.id === id);
                            if (user) {
                                user.pin = '';
                                saveUsers(users);
                                renderUsers();
                                showToast(`🔄 PIN reset for ${id}`, 'success');
                            }
                        }
                    });
                });
            }

            // Add new user
            function addNewUser() {
                let users = getUsers();
                const newId = 'u' + Date.now().toString(36);
                users.push({ id: newId, pin: '' });
                saveUsers(users);
                renderUsers();
                showToast(`➕ Added new user: ${newId}`, 'success');
            }

            // Clear all users
            function clearAll() {
                if (confirm('⚠️ Delete ALL users? This cannot be undone.')) {
                    saveUsers([]);
                    renderUsers();
                    showToast('🗑️ All users cleared.', 'success');
                }
            }

            // Init
            function init() {
                renderUsers();

                addUserBtn.addEventListener('click', addNewUser);
                clearAllBtn.addEventListener('click', clearAll);
                refreshBtn.addEventListener('click', () => {
                    renderUsers();
                    showToast('🔄 Refreshed', 'success');
                });

                // Auto-refresh every 5 seconds
                setInterval(renderUsers, 5000);
            }

            init();
        })();
    </script>
</body>
</html>
