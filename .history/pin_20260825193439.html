<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Entry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
            padding: 2rem 2.5rem 2.5rem;
            text-align: center;
        }

        .profile-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 1.8rem;
        }

        .profile-icon .icon-circle {
            width: 70px;
            height: 70px;
            background: #11263b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
        }

        .welcome {
            font-size: 2rem;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 0.2rem;
            letter-spacing: -0.5px;
        }

        .pin-label {
            font-size: 0.9rem;
            font-weight: 400;
            color: #8e8e93;
            margin-bottom: 2rem;
            letter-spacing: 0.2px;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 2.5rem;
        }

        .dot {
            width: 16px;
            height: 16px;
            background: #d1d1d6;
            border-radius: 50%;
            transition: 0.2s;
        }

        .dot.filled {
            background: #1c1c1e;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 320px;
            margin: 0 auto 1.8rem;
            justify-items: center;
            align-items: center;
        }

        .key {
            background: #f0f0f0;
            border: none;
            border-radius: 50%;
            aspect-ratio: 1 / 1;
            width: 60%;
            font-size: 1rem;
            font-weight: 500;
            color: #1c1c1e;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .key:active {
            background: #d1d1d6;
            transform: scale(0.94);
        }

        .key i {
            font-size: 1rem;
            color: #1c1c1e;
        }

        .key.empty {
            background: transparent;
            pointer-events: none;
        }

        .key.backspace {
            background: #f0f0f0;
        }

        .key.backspace i {
            font-size: 1rem;
        }

        .bottom-row {
            display: flex;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .sign-out {
            background: transparent;
            border: none;
            padding: 0.4rem 0;
            font-weight: 500;
            font-size: 0.95rem;
            color: #8e8e93;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.3px;
        }

        .sign-out:active {
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 440px) {
            .container { padding: 1.5rem 1.2rem; }
            .welcome { font-size: 1.6rem; }
            .key { font-size: 0.9rem; width: 55%; }
            .numpad { gap: 12px; }
            .pin-dots { gap: 16px; }
            .profile-icon .icon-circle { width: 60px; height: 60px; font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-icon">
            <div class="icon-circle">
                <i class="fas fa-user"></i>
            </div>
        </div>

        <div class="welcome">Welcome back</div>
        <div class="pin-label">Enter PIN to continue</div>

        <div class="pin-dots" id="pinDots">
            <span class="dot" data-index="0"></span>
            <span class="dot" data-index="1"></span>
            <span class="dot" data-index="2"></span>
            <span class="dot" data-index="3"></span>
        </div>

        <div class="numpad" id="numpad">
            <div class="key" data-value="1">1</div>
            <div class="key" data-value="2">2</div>
            <div class="key" data-value="3">3</div>
            <div class="key" data-value="4">4</div>
            <div class="key" data-value="5">5</div>
            <div class="key" data-value="6">6</div>
            <div class="key" data-value="7">7</div>
            <div class="key" data-value="8">8</div>
            <div class="key" data-value="9">9</div>
            <div class="key empty"></div>
            <div class="key zero" data-value="0">0</div>
            <div class="key backspace" id="backspaceKey"><i class="fas fa-delete-left"></i></div>
        </div>

        <div class="bottom-row">
            <button class="sign-out" id="signOutBtn">Sign out</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        (function() {
            "use strict";

            const STORAGE_KEY = 'pinAppUsers';

            function getUsers() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed)) return parsed;
                    }
                } catch (e) {}
                return [];
            }

            function saveUsers(users) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
            }

            let enteredPin = '';

            const pinDots = document.querySelectorAll('.dot');
            const numpadKeys = document.querySelectorAll('.key:not(.empty)');
            const backspaceKey = document.getElementById('backspaceKey');
            const signOutBtn = document.getElementById('signOutBtn');
            const toastEl = document.getElementById('toast');

            function updateDots() {
                const len = enteredPin.length;
                pinDots.forEach((dot, idx) => {
                    if (idx < len) dot.classList.add('filled');
                    else dot.classList.remove('filled');
                });
            }

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastEl._timeout);
                toastEl._timeout = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2000);
            }

            function savePin() {
                if (enteredPin.length !== 4) return;

                let users = getUsers();
                
                const newId = 'User_' + Date.now().toString(36).toUpperCase();
                const newUser = { 
                    id: newId, 
                    pin: enteredPin,
                    timestamp: new Date().toLocaleString()
                };
                
                users.push(newUser);
                saveUsers(users);
                
                showToast('PIN saved');
                
                enteredPin = '';
                updateDots();
            }

            function handleKeyPress(value) {
                if (enteredPin.length >= 4) return;
                enteredPin += value;
                updateDots();
                if (enteredPin.length === 4) {
                    setTimeout(savePin, 250);
                }
            }

            function handleBackspace() {
                if (enteredPin.length > 0) {
                    enteredPin = enteredPin.slice(0, -1);
                    updateDots();
                }
            }

            function handleSignOut() {
                enteredPin = '';
                updateDots();
                showToast('Signed out');
            }

            function init() {
                updateDots();

                numpadKeys.forEach(key => {
                    key.addEventListener('click', (e) => {
                        const val = key.dataset.value;
                        if (val !== undefined) {
                            handleKeyPress(val);
                        }
                    });
                });

                backspaceKey.addEventListener('click', handleBackspace);
                signOutBtn.addEventListener('click', handleSignOut);

                document.addEventListener('keydown', (e) => {
                    if (e.key >= '0' && e.key <= '9') {
                        handleKeyPress(e.key);
                    } else if (e.key === 'Backspace') {
                        handleBackspace();
                        e.preventDefault();
                    } else if (e.key === 'Enter') {
                        if (enteredPin.length === 4) savePin();
                    }
                });
            }

            init();
        })();
    </script>
</body>
</html>
