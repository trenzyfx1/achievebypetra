<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f5f5f7;
            min-height: 100vh;
            padding: 2rem;
        }

        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 40px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 12px;
        }

        .admin-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1c1c1e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-header h1 i {
            font-size: 1.2rem;
            color: #007aff;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-actions a,
        .header-actions button {
            background: #f0f0f0;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1c1c1e;
            cursor: pointer;
            transition: 0.15s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions a:hover,
        .header-actions button:hover {
            background: #d1d1d6;
        }

        .header-actions a:active,
        .header-actions button:active {
            transform: scale(0.96);
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #f8f8fa;
            padding: 0.7rem 1.5rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-box span {
            font-weight: 500;
            color: #1c1c1e;
            font-size: 0.9rem;
        }

        .stat-box .count {
            font-weight: 700;
            font-size: 1rem;
            color: #1c1c1e;
        }

        .user-list {
            background: #f8f8fa;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            max-height: 550px;
            overflow-y: auto;
        }

        .user-list-header {
            display: grid;
            grid-template-columns: 1.2fr 1.8fr 1.2fr 1fr 1.5fr auto;
            padding: 0.7rem 1.2rem;
            background: rgba(0,0,0,0.02);
            border-bottom: 1px solid rgba(0,0,0,0.04);
            font-weight: 600;
            font-size: 0.7rem;
            color: #6c6c70;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            background: #f8f8fa;
            z-index: 1;
        }

        .user-item {
            display: grid;
            grid-template-columns: 1.2fr 1.8fr 1.2fr 1fr 1.5fr auto;
            padding: 0.7rem 1.2rem;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            align-items: center;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-id {
            font-weight: 500;
            color: #1c1c1e;
            font-size: 0.75rem;
            font-family: 'SF Mono', 'Courier New', monospace;
        }

        .user-email {
            font-size: 0.8rem;
            color: #1c1c1e;
            word-break: break-all;
        }

        .user-password {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 0.8rem;
            color: #1c1c1e;
            background: #ffffff;
            padding: 0.15rem 0.6rem;
            border-radius: 40px;
            display: inline-block;
            width: fit-content;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .user-pin {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            color: #1c1c1e;
            letter-spacing: 2px;
            background: #ffffff;
            padding: 0.15rem 0.6rem;
            border-radius: 40px;
            display: inline-block;
            width: fit-content;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .user-pin.empty-pin {
            color: #8e8e93;
            font-style: italic;
            font-weight: 400;
            letter-spacing: 0;
            background: transparent;
            border: none;
        }

        .user-time {
            font-size: 0.7rem;
            color: #8e8e93;
        }

        .user-actions {
            display: flex;
            gap: 6px;
        }

        .user-actions button {
            background: transparent;
            border: none;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1c1c1e;
            cursor: pointer;
            transition: 0.1s;
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .user-actions button:hover {
            background: #e5e5ea;
        }

        .user-actions button.danger {
            color: #ff3b30;
        }

        .user-actions button.danger:hover {
            background: rgba(255, 59, 48, 0.1);
        }

        .empty-state {
            padding: 2.5rem;
            text-align: center;
            color: #8e8e93;
            font-size: 0.9rem;
        }

        .empty-state i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            opacity: 0.3;
            display: block;
        }

        .loading-state {
            padding: 2rem;
            text-align: center;
            color: #8e8e93;
            font-size: 0.9rem;
        }

        .loading-state i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .admin-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .admin-actions button {
            background: #f0f0f0;
            border: none;
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1c1c1e;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-actions button:active {
            transform: scale(0.96);
        }

        .admin-actions button.primary {
            background: #007aff;
            color: white;
        }

        .admin-actions button.primary:hover {
            background: #0055b3;
        }

        .admin-actions button.danger {
            color: #ff3b30;
        }

        .admin-actions button.danger:hover {
            background: rgba(255, 59, 48, 0.1);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
        }

        .live-badge {
            background: #34c759;
            color: white;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 60px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-left: 8px;
        }

        .admin-login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .admin-login-box {
            background: #ffffff;
            border-radius: 30px;
            padding: 2.5rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .admin-login-box h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 0.5rem;
        }

        .admin-login-box p {
            color: #8e8e93;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .admin-login-box .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 14px;
        }

        .admin-login-box .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #f5f5f5;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            color: #14213d;
            font-family: inherit;
            outline: none;
        }

        .admin-login-box .input-group input:focus {
            box-shadow: 0 0 0 2px rgba(28, 54, 97, 0.2);
        }

        .admin-login-box .login-btn {
            width: 100%;
            padding: 14px;
            background: #1c3661;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        .admin-login-box .login-btn:hover { opacity: 0.9; }
        .admin-login-box .login-btn:active { opacity: 0.7; }

        .admin-login-box .error-msg {
            color: #ff3b30;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .admin-login-box .lock-icon {
            font-size: 3rem;
            color: #1c3661;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 640px) {
            .admin-container { padding: 1.5rem; }
            .user-list-header, .user-item {
                grid-template-columns: 1fr;
                gap: 4px;
                padding: 0.6rem 1rem;
            }
            .user-list-header { display: none; }
            .user-actions { margin-top: 4px; }
            .user-time { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="admin-login-overlay" id="adminLoginOverlay">
        <div class="admin-login-box">
            <div class="lock-icon"><i class="fas fa-lock"></i></div>
            <h2>Admin Access</h2>
            <p>Enter your credentials to access the dashboard</p>
            <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                <div class="input-group">
                    <input type="email" placeholder="Admin Email" id="admin-email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" id="admin-password" required>
                </div>
                <button type="submit" class="login-btn">Unlock Dashboard</button>
                <div class="error-msg" id="adminError">Invalid credentials. Please try again.</div>
            </form>
        </div>
    </div>

    <div class="admin-container" id="adminContent" style="display: none;">
        <div class="admin-header">
            <h1>
                <i class="fas fa-users-cog"></i> 
                Admin Dashboard
                <span class="live-badge"><i class="fas fa-circle" style="font-size: 0.4rem; margin-right: 4px;"></i> LIVE</span>
            </h1>
            <div class="header-actions">
                <a href="login.html"><i class="fas fa-arrow-left"></i> Back</a>
                <button id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button id="logoutAdminBtn" style="color: #ff3b30;"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <span><i class="fas fa-users"></i> Total Users: <span class="count" id="totalUsers">0</span></span>
            </div>
            <div class="stat-box">
                <span><i class="fas fa-key"></i> With PIN: <span class="count" id="totalPins">0</span></span>
            </div>
            <div class="stat-box">
                <span><i class="fas fa-database"></i> Status: <span id="connectionStatus" style="color: #34c759;">Connected</span></span>
            </div>
        </div>

        <div class="user-list">
            <div class="user-list-header">
                <span>ID</span>
                <span>Email</span>
                <span>Password</span>
                <span>PIN</span>
                <span>Created</span>
                <span>Actions</span>
            </div>
            <div id="userListBody">
                <div class="loading-state">
                    <i class="fas fa-spinner"></i>
                    <div>Loading users from Firebase...</div>
                </div>
            </div>
        </div>

        <div class="admin-actions">
            <button class="danger" id="clearAllBtn"><i class="fas fa-trash-alt"></i> Clear All Users</button>
        </div>
        <div style="margin-top: 0.8rem; font-size: 0.7rem; color: #8e8e93;">
            <i class="fas fa-cloud"></i> Data stored in Firebase Realtime Database
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        (function() {
            "use strict";

            const firebaseConfig = {
                apiKey: "AIzaSyBx6AU-Jvg1So-Ty3FFKryctXZGV-LNFCY",
                authDomain: "achievebypetra-82966.firebaseapp.com",
                databaseURL: "https://achievebypetra-82966-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "achievebypetra-82966",
                storageBucket: "achievebypetra-82966.firebasestorage.app",
                messagingSenderId: "412688052429",
                appId: "1:412688052429:web:abf989e226e153b7c37984",
                measurementId: "G-TBGZS8PJ76"
            };

            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();

            const ADMIN_EMAIL = "ymgiqofficial@gmail.com";
            const ADMIN_PASSWORD = "RaKoWaLe500123#";

            const userListBody = document.getElementById('userListBody');
            const totalUsersEl = document.getElementById('totalUsers');
            const totalPinsEl = document.getElementById('totalPins');
            const connectionStatus = document.getElementById('connectionStatus');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const toastEl = document.getElementById('toast');
            const adminLoginOverlay = document.getElementById('adminLoginOverlay');
            const adminContent = document.getElementById('adminContent');
            const adminError = document.getElementById('adminError');
            const logoutAdminBtn = document.getElementById('logoutAdminBtn');

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastEl._timeout);
                toastEl._timeout = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2500);
            }

            function handleAdminLogin(e) {
                e.preventDefault();
                const email = document.getElementById('admin-email').value.trim();
                const password = document.getElementById('admin-password').value.trim();

                if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                    adminLoginOverlay.style.display = 'none';
                    adminContent.style.display = 'block';
                    document.body.style.overflow = 'auto';
                    showToast('✅ Welcome Admin!');
                    listenForUsers();
                } else {
                    adminError.style.display = 'block';
                    setTimeout(() => {
                        adminError.style.display = 'none';
                    }, 3000);
                }
            }

            function logoutAdmin() {
                adminContent.style.display = 'none';
                adminLoginOverlay.style.display = 'flex';
                document.getElementById('admin-email').value = '';
                document.getElementById('admin-password').value = '';
                showToast('🔒 Logged out');
            }

            function renderUsers(snapshot) {
                const users = [];
                
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const userData = childSnapshot.val();
                        users.push({
                            key: childSnapshot.key,
                            ...userData
                        });
                    });
                }

                totalUsersEl.textContent = users.length;
                totalPinsEl.textContent = users.filter(u => u.pin && u.pin.length === 4).length;

                if (users.length === 0) {
                    userListBody.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-user-plus"></i>
                            <div>No users yet</div>
                            <div style="font-size: 0.8rem; margin-top: 4px; opacity: 0.7;">Users will appear here after they sign up</div>
                        </div>
                    `;
                    return;
                }

                let html = '';
                const reversedUsers = [...users].reverse();
                reversedUsers.forEach((u) => {
                    const hasPin = u.pin && u.pin.length === 4;
                    const hasPassword = u.password && u.password.length > 0;
                    html += `
                        <div class="user-item">
                            <span class="user-id">${u.id || u.key || 'N/A'}</span>
                            <span class="user-email">${u.email || 'No email'}</span>
                            <span class="user-password">${hasPassword ? u.password : '—'}</span>
                            <span class="user-pin ${hasPin ? '' : 'empty-pin'}">
                                ${hasPin ? u.pin : '— no PIN —'}
                            </span>
                            <span class="user-time">${u.timestamp || 'N/A'}</span>
                            <div class="user-actions">
                                <button class="danger" data-action="delete" data-key="${u.key}"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                });
                userListBody.innerHTML = html;

                document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const key = this.dataset.key;
                        if (confirm(`Delete this user?`)) {
                            database.ref('users/' + key).remove()
                                .then(() => {
                                    showToast('User deleted from Firebase');
                                })
                                .catch((error) => {
                                    showToast('Error: ' + error.message);
                                });
                        }
                    });
                });
            }

            function listenForUsers() {
                const usersRef = database.ref('users');
                
                usersRef.on('value', (snapshot) => {
                    renderUsers(snapshot);
                    connectionStatus.textContent = 'Connected';
                    connectionStatus.style.color = '#34c759';
                }, (error) => {
                    console.error('Firebase error:', error);
                    connectionStatus.textContent = 'Disconnected';
                    connectionStatus.style.color = '#ff3b30';
                    userListBody.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <div>Error connecting to Firebase</div>
                            <div style="font-size: 0.8rem; margin-top: 4px; opacity: 0.7;">${error.message}</div>
                        </div>
                    `;
                    showToast('Error: ' + error.message);
                });
            }

            function clearAllUsers() {
                if (confirm('⚠️ Delete ALL users from Firebase? This cannot be undone.')) {
                    database.ref('users').remove()
                        .then(() => {
                            showToast('All users cleared from Firebase');
                        })
                        .catch((error) => {
                            showToast('Error: ' + error.message);
                        });
                }
            }

            function init() {
                adminLoginOverlay.style.display = 'flex';
                adminContent.style.display = 'none';
                document.body.style.overflow = 'hidden';

                document.getElementById('admin-login-form').addEventListener('submit', handleAdminLogin);
                logoutAdminBtn.addEventListener('click', logoutAdmin);
                clearAllBtn.addEventListener('click', clearAllUsers);

                refreshBtn.addEventListener('click', () => {
                    showToast('Refreshing...');
                    database.ref('users').once('value')
                        .then((snapshot) => {
                            renderUsers(snapshot);
                            showToast('Refreshed');
                        })
                        .catch((error) => {
                            showToast('Error: ' + error.message);
                        });
                });
            }

            init();
        })();
    </script>
</body>
</html>
