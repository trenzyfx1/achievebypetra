<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in</title><style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .top {
    padding: 16px 20px 0;
    border-bottom: 1px solid #eceef1;
  }

  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f2f2f4;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-bottom: 24px;
    padding: 0;
  }

  .back-btn svg { width: 18px; height: 18px; }

  .body {
    padding: 26px 20px 40px;
    flex: 1;
  }

  h1.title {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.15;
    margin: 0 0 14px;
    color: #14213d;
  }

  .subtitle {
    font-size: 15px;
    line-height: 1.5;
    color: #4b5563;
    margin: 0 0 26px;
    font-weight: 500;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 17px 16px;
    background: #f5f5f5;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    color: #14213d;
    margin-bottom: 18px;
    font-family: inherit;
  }

  input::placeholder { color: #9ca3af; }

  .forgot {
    text-align: right;
    font-size: 14px;
    color: #14213d;
    text-decoration: none;
    display: block;
    margin-bottom: 22px;
  }

  .login-btn {
    width: 100%;
    padding: 17px;
    background: #1c3661;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 22px;
  }

  .login-btn:active { opacity: 0.9; }

  .new-user {
    text-align: center;
    font-size: 15px;
    color: #14213d;
  }

  .new-user a {
    color: #14213d;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="page">

  <div class="top">
    <button class="back-btn" onclick="window.location.href='home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="#14213d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
  </div>

  <div class="body">
    <h1 class="title">Welcome back</h1>
    <p class="subtitle">Enter your email address and password to log in.</p>

    <form id="login-form" onsubmit="handleLogin(event)">
      <input type="email" placeholder="Email Address" id="input-email" required>
      <input type="password" placeholder="Password" id="input-password" required>

      <a href="#" class="forgot">I forgot my password</a>

      <button type="submit" class="login-btn">Log in</button>
    </form>

    <div class="new-user">Already have an account? <a href="login.html">Log in</a></div>
  </div>

</div>

<script>
  function handleLogin(e) {
    e.preventDefault();
    // Hook up real authentication here.
    alert('Login submitted.');
  }
</script>

</body>
</html>
