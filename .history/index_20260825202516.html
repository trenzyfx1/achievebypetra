<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>achievebype</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1c3661;
    overflow: hidden;
  }

  .splash {
    position: relative;
    width: 100%;
    height: 100vh;
    background: #1c3661;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .splash-img {
    display: block;
    height: 100vh;
    max-height: 100vh;
    width: auto;
    max-width: 100%;
    object-fit: contain;
  }

  .loader {
    position: absolute;
    left: 50%;
    bottom: 5%;
    transform: translateX(-50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: translateX(-50%) rotate(360deg); }
  }
</style>
</head>
<body>

<div class="splash">
  <img class="splash-img" src="splash.jpg" alt="achieve by PETRA">
  <div class="loader"></div>
</div>

<script>
  setTimeout(function () {
    window.location.href = "home.html";
  }, 1800);
</script>
<script src="protect.js"></script>

</body>
</html>
