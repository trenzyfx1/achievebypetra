<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>achieve by PETRA</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1c3661;
    overflow: hidden;
  }

  .splash {
    position: relative;
    width: 100%;
    height: 100vh;
    background: #1c3661;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .splash-img {
    display: block;
    height: 100vh;
    max-height: 100vh;
    width: auto;
    max-width: 100%;
    object-fit: contain;
  }

  .loader {
    position: absolute;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    display: flex;
    gap: 7px;
  }

  .loader span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ffffff;
    opacity: 0.35;
    animation: pulse 0.9s ease-in-out infinite;
  }

  .loader span:nth-child(2) { animation-delay: 0.15s; }
  .loader span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="splash">
  <img class="splash-img" src="splash.jpg" alt="achieve by PETRA">
  <div class="loader">
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>

<script>
  setTimeout(function () {
    window.location.href = "home.html";
  }, 1800);
</script>

</body>
</html>
